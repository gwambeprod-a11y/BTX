name: Compiler BATIX Android APK Automatiquement

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-batix-apk:
    name: Générer le fichier BATIX.apk (Node 24 & Java v5)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupération du code du dépôt (Node 24)
        uses: actions/checkout@v5

      - name: 2. Installation de Node.js 24 (sans cache lockfile)
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: 3. Installation de Java JDK 17 (setup-java v5)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Configuration du SDK Android natif (Sans action Node 20 dépréciée)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: 5. Préparation automatique du projet Capacitor Android
        run: |
          rm -rf batix-build
          mkdir -p batix-build/www

          HTML_FILE=$(find . -maxdepth 3 \( -name "BATIX_Marketplace_App.html" -o -name "BATIX_App_Interactive.html" -o -name "index.html" \) ! -path "./batix-build/*" | head -n 1)
          if [ -n "$HTML_FILE" ]; then
            echo "Fichier d'application trouvé : $HTML_FILE"
            cp "$HTML_FILE" batix-build/www/index.html
          else
            echo "Création d'un index.html de secours..."
            echo "<!DOCTYPE html><html><head><meta charset='utf-8'><title>BATIX</title></head><body><h1>BATIX</h1></body></html>" > batix-build/www/index.html
          fi

          cd batix-build

          cat << 'EOF' > package.json
          {
            "name": "batix-mobile-app",
            "version": "3.3.0",
            "description": "BATIX Marketplace BTP & Livraison Express",
            "main": "www/index.html",
            "dependencies": {
              "@capacitor/android": "^6.1.0",
              "@capacitor/core": "^6.1.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.1.0"
            }
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "cm.batix.app",
            "appName": "BATIX",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: 6. Compilation de l'exécutable Android (.APK)
        run: |
          cd batix-build/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../BATIX-v3.3-Android.apk
          ls -lh ../../BATIX-v3.3-Android.apk

      - name: 7. Publication du fichier BATIX-v3.3-Android.apk (Node 24)
        uses: actions/upload-artifact@v6
        with:
          name: BATIX-Android-APK
          path: BATIX-v3.3-Android.apk
          if-no-files-found: error
